name=ESP32-SNMPv3-Agent
version=0.1.0
author=PT Alat Cerdas Adikarya Bersama
maintainer=PT Alat Cerdas Adikarya Bersama
sentence=SNMPv3 agent (USM authPriv: SHA-256 + AES-128) for ESP32 / ESP32-S2 / ESP32-S3 sensor telemetry.
paragraph=Implements the SNMPv3 user-based security model (RFC 3414) with HMAC-SHA-256 authentication (RFC 7860) and AES-128 CFB privacy (RFC 3826), including engine ID, boots and time management with NVS persistence, plus Get, GetNext, GetBulk, Set and v3 traps and informs over Wi-Fi. SNMPv3 only - no v1/v2c. Leverages the ESP32 family hardware-accelerated SHA-256 and AES engines. GPL-3.0 licensed.
category=Communication
url=https://github.com/alatcerdas/esp32-snmpv3-agent
architectures=esp32
