name: Compile Examples

# Compiles every example in examples/ for the three supported FQBNs on every
# push/PR — arduino-cli builds ALL of src/ (BER.c, USM.c, crypto_esp32.c incl.
# mbedtls), so this is the ESP-side compile gate for the whole library core.
# Examples still compile against the M0 agent stub; the stub's begin() returns
# false at runtime until M2 wires the real agent (runtime checks are M2+).
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - esp32:esp32:esp32     # classic ESP32
          - esp32:esp32:esp32s3   # ESP32-S3
          - esp32:esp32:esp32s2   # ESP32-S2
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Register the Espressif (arduino-esp32) platform
        run: arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install ESP32 core v3.x + sensor library
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "DHT sensor library by Adafruit"

      # SHA-pinned 2026-09-29: the upstream repo has no version tags (the
      # floating @v1 ref does not resolve and fails the job at 'Set up job').
      - name: Compile all examples
        uses: arduino/actions/libraries/compile-examples@3a9ca335ba366215f4dcc195794585ae625c859f
        with:
          fqbn: ${{ matrix.fqbn }}