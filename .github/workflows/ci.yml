name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: arduino-lint (Arduino Library specification compliance)
        uses: arduino/arduino-lint-action@v2
        with:
          # Gitea injects a Gitea token as github.token; GitHub API rejects it.
          # Pass the real GitHub token (stored as Actions secret GH_TOKEN).
          token: ${{ secrets.GH_TOKEN }}
          library-manager: false   # not yet in the Library Manager index (M3);
                                   # 'update' mode would false-positive LP018
          compliance: specification

  # Host-side unit tests (no hardware, no Arduino SDK) — BER codec + USM
  # layer against generated RFC/pysnmp vectors.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host test suite
        run: tests/host/run_host_tests.sh