name: Docs

# Builds the MkDocs Material site and deploys it to GitHub Pages.
#
# One-time repository setup: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". The deploy job is skipped for pull requests, so PRs
# only validate that the site builds (--strict).

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'src/README.md'
      - 'tests/**/README.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'src/README.md'
      - 'tests/**/README.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs Material
        run: pip install -r requirements-docs.txt

      - name: Build site (strict)
        run: python scripts/docs.py build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy docs
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
